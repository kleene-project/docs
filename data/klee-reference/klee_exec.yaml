command: klee exec
deprecated: false
examples: "\n### Run `klee container exec` on a running container\n\nFirst, start\
  \ a container.\n\n```console\n$ klee run --name mycontainer FreeBSD:latest /bin/sh\
  \ /etc/rc\nad813478a0ec\ncreated execution instance e9e43e57162d\nELF ldconfig path:\
  \ /lib /usr/lib /usr/lib/compat\n32-bit compatibility ldconfig path: /usr/lib32\n\
  Updating motd:.\nCreating and/or trimming log files.\nClearing /tmp (X related).\n\
  Updating /var/run/os-release done.\nStarting syslogd.\n/etc/rc: WARNING: failed\
  \ to start syslogd\nStarting sendmail_submit.\n554 5.3.0 host \"localhost\" unknown:\
  \ Protocol not supported\n/etc/rc: WARNING: failed to start sendmail_submit\nStarting\
  \ sendmail_msp_queue.\nStarting cron.\n\nTue Nov  7 09:24:44 UTC 2023\n\ne9e43e57162d\
  \ has exited with exit-code 0\n```\n\nThis creates and starts a container named\
  \ `mycontainer` and runs the init\nscript `/bin/sh /etc/rc`. Once the container\
  \ has been initialized, the process\nexists and the container runs in the background.\n\
  \nNext, execute a non-interactive command on the container:\n\n```console\n$ klee\
  \ container exec mycontainer touch /tmp/execWorks\n```\n\nThis creates a new file\
  \ `/tmp/execWorks` inside the running container,\nand exits.\n\nNext, start an interactive\
  \ shell in the container:\n\n```console\n$ klee container exec -it mycontainer /bin/sh\n\
  ```\n\nThis starts a shell session in the container.\n\nNext, set environment variables\
  \ in a new shell session.\n\n`klee container exec` runs with a minimal amount of\
  \ environment variables\nby default. Use the `--env` (or `-e`) to set additional\
  \ environment variables\nfor the process.\n\nBelow, a new shell session in the container\
  \ `mycontainer` is created with\nenvironment variables `$VAR_A` and `$VAR_B` set\
  \ to \"1\" and \"2\" respectively.\nThe environment variables are only valid for\
  \ the process started by the\ncommand that defined the variables.\n\n```console\n\
  $ klee exec -e VAR_A=1 -e VAR_B=2 mycontainer env\ncreated execution instance 84effca72ec8\n\
  VAR_B=2\nVAR_A=1\nSHELL=/bin/sh\nHOME=/root\nUSER=root\nPATH=/sbin:/bin:/usr/sbin:/usr/bin:/usr/local/bin\n\
  \n84effca72ec8 has exited with exit-code 0\n```\n\n**Note on PATH and non-root users:**\
  \ kleened constructs the environment\nitself: `PATH`, `HOME`, `USER` and `SHELL`\
  \ default to the configured user's\nvalues, and variables from the image configuration\
  \ or `--env` are added on\ntop (an explicit `PATH` overrides the default). For `root`\
  \ (the default)\nthe injected variables are exactly what the process sees. When\
  \ the container\nor exec runs as a **non-root user**, the process is selected through\n\
  FreeBSD's `setusercontext(3)`, which re-builds `PATH` from the target\nuser's login\
  \ class \u2014 so a non-root process can end up with a different\n`PATH` than the\
  \ one injected, and other variables still pass through. If a\nspecific `PATH` matters\
  \ for a non-root user, verify with `env` what the\nprocess actually sees.\n"
experimental: false
experimentalcli: false
long: '

  Run a new command in a running container.


  A command executed with `klee container exec` is not restarted if

  the container is restarted.


  `COMMAND` must be an executable and a chained command needs to be quoted.

  For example, `klee container exec my_container sh -c "echo a && echo b"` works,

  but `klee container exec my_container "echo a && echo b"` does not.

  '
