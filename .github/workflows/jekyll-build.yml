name: Jekyll build check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build the docs site with Jekyll
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          # Not .ruby-version (2.7.6, stale): Gemfile.lock pins nokogiri
          # 1.17.2, which needs Ruby >= 3.1.
          ruby-version: '3.3'
          bundler-cache: true

      # _config.yml sets safe: true, so this build matches what GitHub Pages'
      # own Jekyll does with the site (the _plugins/ directory is ignored).
      - run: bundle exec jekyll build -d _site
