name: Build and deploy docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Style-guide terminology (e.g. ipnet/vnet in code style).
      - name: Check terminology
        run: python scripts/check_terms.py

      # Non-empty title+description, no H1 in the body (Material injects it).
      - name: Check front matter
        run: python scripts/check_frontmatter.py

      # Spelling; .codespellrc skips generated files and assets.
      - name: Check spelling
        run: codespell

      # Internal links and nav membership are enforced by mkdocs itself:
      # the validation: block in mkdocs.yml plus --strict below fail the
      # build on absolute/unrecognized links, broken anchors and pages
      # missing from the nav.
      - name: Build
        run: mkdocs build --strict

      # PRs get the build check only; the deploy job below publishes.
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Weekly external-link check. External sites flake, so this never fails
  # the build; it opens/updates an issue listing broken links instead.
  linkcheck:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build site
        run: |
          pip install -r requirements.txt
          mkdocs build --strict

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress './site/**/*.html'
          fail: false
          output: ./lychee-report.md

      - name: Create or update issue
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const title = 'Broken external links on kleene.dev';
            const body = fs.readFileSync('./lychee-report.md', 'utf8');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const issue = existing.data.find(i => i.title === title);
            if (issue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
              });
            }

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
