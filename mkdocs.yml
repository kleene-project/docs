site_name: Kleene Documentation
site_url: https://kleene.dev
site_description: Documentation for Kleene, a container management tool for FreeBSD
site_author: The Kleene Project
repo_url: https://github.com/kleene-project/docs
repo_name: kleene-project/docs
edit_uri: edit/main/docs/
copyright: Copyright 2023 The Kleene Project — portions Copyright 2016 Docker, Inc., Apache-2.0

docs_dir: docs
use_directory_urls: true
strict: true

# With strict: true these warnings fail the build:
validation:
  nav:
    omitted_files: warn
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

# SUMMARY.md is the literate-nav navigation source, not a page on the site.
exclude_docs: |
  SUMMARY.md

# 404.md must stay out of the nav (MkDocs publishes it as the site's 404 page);
# without this it would be flagged by validation.nav.omitted_files.
not_in_nav: |
  404.md

# The site navigation lives in docs/SUMMARY.md, read by mkdocs-literate-nav.
# scripts/gen_cli_reference.py reads the same file to know which klee reference
# pages to generate, so navigation and generation cannot drift apart.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/images/kleene-docs-logo.svg
  icon:
    repo: fontawesome/brands/github
  custom_dir: overrides/

extra_css:
  - assets/css/kleene.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: en
  - gen-files:
      scripts:
        - scripts/gen_cli_reference.py
        - scripts/gen_glossary.py
  - literate-nav:
      nav_file: SUMMARY.md
  - redirects:
      redirect_maps:
        # Pre-existing entries (re-pointed where their target moved)
        reference/builder.md: reference/dockerfile.md
        reference/kleened/latest/index.md: reference/kleened/kleened-v0.0.1.md
        reference/glossary.md: glossary.md
        CONTRIBUTING.md: project/contribute/index.md
        # get-started: overview becomes "What is Kleene?", old index becomes the tutorial overview
        get-started/overview.md: get-started/index.md
        get-started/index.md: get-started/tutorial/index.md
        get-started/02_our_app.md: get-started/tutorial/containerize-app.md
        get-started/03_updating_app.md: get-started/tutorial/update-app.md
        get-started/04_persisting_data.md: get-started/tutorial/persist-data.md
        get-started/05_nullfs_mounts.md: get-started/tutorial/nullfs-mounts.md
        get-started/06_multi_container.md: get-started/tutorial/multi-container.md
        # install
        install/index.md: get-started/install.md
        # guides/build (introduction.md was split: index.md + context.md)
        building/introduction.md: guides/build/index.md
        building/dockerfile_best-practices.md: guides/build/best-practices.md
        building/snapshots.md: guides/build/snapshots.md
        building/base-images.md: guides/build/base-images.md
        # guides/run
        run/introduction.md: guides/run/index.md
        run/jail-parameters.md: guides/run/jail-parameters.md
        run/resource_constraints.md: guides/run/resource-constraints.md
        run/start-containers-automatically.md: guides/run/autostart.md
        # guides/network
        run/network/index.md: guides/network/index.md
        run/network/ipnet.md: guides/network/ipnet.md
        run/network/vnet.md: guides/network/vnet.md
        run/network/host.md: guides/network/host.md
        run/network/none.md: guides/network/none.md
        run/network/publish-ports.md: guides/network/publish-ports.md
        run/network/firewall.md: guides/network/firewall.md
        run/network/troubleshoot.md: guides/network/troubleshoot.md
        # guides/storage
        run/storage/index.md: guides/storage/index.md
        run/storage/volumes.md: guides/storage/volumes.md
        run/storage/nullfs-mounts.md: guides/storage/nullfs-mounts.md
        # guides/operate
        operation/index.md: guides/operate/index.md
        operation/protect-access.md: guides/operate/protect-access.md
        operation/zfs.md: guides/operate/zfs.md
        # project
        external-resources.md: project/freebsd-resources.md
        release-notes.md: project/release-notes.md
        contribute/project-status.md: project/status.md
        contribute/community.md: project/community.md
        contribute/overview.md: project/contribute/index.md
        contribute/contribute-guide.md: project/contribute/guidelines.md
        contribute/style-guide.md: project/contribute/style-guide.md
        contribute/file-conventions.md: project/contribute/file-conventions.md
        contribute/ui.md: project/contribute/ui.md
        contribute/klee-kleened.md: project/contribute/klee-kleened.md
  - minify:
      minify_html: true
